version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?No POSTGRES_PASSWORD provided}
      POSTGRES_DB: reviewit
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reviewit"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-api:
    build:
      context: ./user-microservice
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=reviewit;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=http://auth-api:5000
      - Jwt__Audience=http://review-api:5001
      - ALLOWEDHOSTS=localhost;auth-api;review-api
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - backend-network

  review-api:
    build:
      context: ./review-microservice
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=reviewit;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=http://auth-api:5000
      - Jwt__Audience=http://review-api:5001
      - ALLOWEDHOSTS=localhost;auth-api;review-api
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  postgres-data:
